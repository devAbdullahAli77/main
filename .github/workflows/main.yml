name: Sync main-repo → test-repo

on:
  push:
    branches:
      - main # Trigger when pushing to main branch in main-repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure rsync is available
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Clone test-repo
        run: |
          git clone https://x-access-token:${{ secrets.TEST_REPO_SYNC }}@github.com/devAbdullahAli77/test-repo.git
          # Note: removed --delete flag to avoid deleting extra files in target
          rsync -av ./ test-repo/ --exclude '.git' --exclude '.github'

      - name: Commit and create PR if conflict
        run: |
          cd test-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          if git diff-index --quiet HEAD; then
            echo "✅ No changes to sync."
            exit 0
          fi

          git commit -m "Sync from main repo $(date +'%Y-%m-%d %H:%M:%S')"
          git fetch origin main

          # Try to rebase with main
          if ! git rebase origin/main; then
            echo "⚠️ Conflict detected — creating pull request."

            # Create a temporary branch for the conflicted sync
            BRANCH_NAME="sync-conflict-$(date +'%Y%m%d-%H%M%S')"
            git rebase --abort || true
            git checkout -b "$BRANCH_NAME"

            git push origin "$BRANCH_NAME"

            # Use GitHub CLI to create PR
            gh pr create \
              --repo devAbdullahAli77/test-repo \
              --head "$BRANCH_NAME" \
              --base main \
              --title "Sync from main-repo (conflict detected)" \
              --body "Automatic sync from main-repo failed due to conflicts. Please resolve manually."

            exit 0
          fi

          # If rebase succeeds, push directly
          git push origin main
          echo "✅ Sync successful!"
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_SYNC }}
