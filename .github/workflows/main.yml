name: Sync main-repo → test-repo

on:
  push:
    branches:
      - main # Trigger when pushing to main branch in main-repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main-repo (source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsync and gh
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync gh

      - name: Clone test-repo (target)
        run: |
          git clone https://x-access-token:${{ secrets.TEST_REPO_SYNC }}@github.com/devAbdullahAli77/test-repo.git
          rm -rf test-repo/test-repo

      - name: Sync files from source → target
        run: |
          cd test-repo
          git fetch origin main
          cd ..
          # Sync all files except .git, .github, and repo itself
          rsync -av ./ test-repo/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'test-repo'

      - name: Commit changes or create PR if conflict
        run: |
          set -e
          cd test-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          if git diff-index --quiet HEAD; then
            echo "✅ No changes to sync."
            exit 0
          fi

          git commit -m "Sync from main-repo $(date +'%Y-%m-%d %H:%M:%S')"

          echo "🔄 Fetching latest changes from origin/main..."
          git fetch origin main

          echo "⚗️ Attempting rebase onto origin/main..."
          if ! git rebase origin/main; then
            echo "⚠️ Conflict detected — creating pull request."

            git rebase --abort || true
            BRANCH_NAME="sync-conflict-$(date +'%Y%m%d-%H%M%S')"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"

            gh pr create \
              --repo devAbdullahAli77/test-repo \
              --head "$BRANCH_NAME" \
              --base main \
              --title "Sync from main-repo (conflict detected)" \
              --body "Automatic sync from main-repo failed due to conflicts. Please resolve manually."

            exit 0
          fi

          git push origin main
          echo "✅ Sync successful (no conflicts)."
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_SYNC }}
