name: Sync main-repo  → test-repo

on:
  push:
    branches:
      - main # Trigger when pushing to main branch in main-repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure rsync is available
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Clone test-repo
        run: |
          git clone https://x-access-token:${{ secrets.TEST_REPO_SYNC }}@github.com/devAbdullahAli77/test-repo.git
          rsync -av --delete ./ test-repo/ --exclude '.git' --exclude '.github'

      - name: Commit and Push changes
        run: |
          cd test-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          if git diff-index --quiet HEAD; then
            echo "✅ No changes to sync."
            exit 0
          fi

          git commit -m "Sync from main repo $(date +'%Y-%m-%d %H:%M:%S')"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "❌ Conflict detected! Please resolve manually in test-repo."
            exit 1
          fi
          git push origin main
          echo "✅ Sync successful!"
