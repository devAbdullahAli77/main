name: Sync grand-deepswan → internal-grand-deepswan

on:
  push:
    branches:
      - main # Trigger when pushing to main branch in grand-deepswan

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout grand-deepswan (source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsync and gh
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync gh

      - name: Clone internal-grand-deepswan (target)
        run: |
          git clone https://x-access-token:${{ secrets.INTERNAL_REPO_SYNC }}@github.com/devAbdullahAli77/internal-grand-deepswan.git
          rm -rf internal-grand-deepswan/internal-grand-deepswan

      - name: Sync files from source → target
        run: |
          cd internal-grand-deepswan
          git fetch origin main
          cd ..
          # Sync all files except .git, .github, and repo itself
          rsync -av ./ internal-grand-deepswan/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'internal-grand-deepswan'

      - name: Commit changes or create PR if conflict
        run: |
          set -e
          cd internal-grand-deepswan
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          if git diff-index --quiet HEAD; then
            echo "✅ No changes to sync."
            exit 0
          fi

          git commit -m "Sync from grand-deepswan $(date +'%Y-%m-%d %H:%M:%S')"

          echo "🔄 Fetching latest changes from origin/main..."
          git fetch origin main

          echo "⚗️ Attempting rebase onto origin/main..."
          if ! git rebase origin/main; then
            echo "⚠️ Conflict detected — creating pull request."

            git rebase --abort || true
            BRANCH_NAME="sync-conflict-$(date +'%Y%m%d-%H%M%S')"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"

            gh pr create \
              --repo devAbdullahAli77/internal-grand-deepswan \
              --head "$BRANCH_NAME" \
              --base main \
              --title "Sync from grand-deepswan (conflict detected)" \
              --body "Automatic sync from grand-deepswan failed due to conflicts. Please resolve manually."

            exit 0
          fi

          git push origin main
          echo "✅ Sync successful (no conflicts)."
        env:
          GH_TOKEN: ${{ secrets.INTERNAL_REPO_SYNC }}
